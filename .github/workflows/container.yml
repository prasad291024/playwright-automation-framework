name: Container and Kubernetes

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'k8s/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'scripts/run-app-suite.cjs'
      - 'config/**'
      - 'globals/**'
      - 'tests/shared/api/**'
      - '.github/workflows/container.yml'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ui-automation-framework
  IMAGE_TAG: '1.64.1'

jobs:
  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.34.1

      - name: Render Kustomize overlays
        shell: bash
        run: |
          kubectl kustomize k8s/base > rendered-base.yaml
          kubectl kustomize k8s/overlays/local > rendered-local.yaml

      - name: Validate Kubernetes schemas with kubeconform
        shell: bash
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary \
            /work/rendered-base.yaml \
            /work/rendered-local.yaml \
            /work/k8s/base/secret.example.yaml

      - name: Lint manifests with kube-linter (advisory)
        shell: bash
        run: |
          for manifest in rendered-base.yaml rendered-local.yaml; do
            echo "Linting ${manifest}"
            docker run --rm -v "$PWD:/work" \
              stackrox/kube-linter:v0.7.2 lint "/work/${manifest}" || true
          done

  docker:
    name: Build, scan, and smoke test image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Validate Compose file
        run: docker compose config --quiet

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify non-root execution
        shell: bash
        run: |
          uid="$(docker run --rm --entrypoint id ${{ env.IMAGE_NAME }}:ci -u)"
          test "$uid" = "1001"
          echo "Running as UID ${uid}"

      - name: Verify Chromium launches with a read-only root filesystem
        shell: bash
        run: |
          docker run --rm \
            --read-only \
            --tmpfs /tmp \
            --tmpfs /home/pwuser \
            --shm-size=1g \
            --cap-drop=ALL \
            --security-opt no-new-privileges \
            --entrypoint node \
            ${{ env.IMAGE_NAME }}:ci \
            -e "const { chromium } = require('@playwright/test'); (async () => { const browser = await chromium.launch(); console.log('chromium launched'); await browser.close(); })().catch((error) => { console.error(error); process.exit(1); });"

      - name: Run shared API suite in the container
        shell: bash
        run: |
          mkdir -p test-results playwright-report storage-state screenshots
          chmod -R 0777 test-results playwright-report storage-state screenshots

          docker run --rm \
            --read-only \
            --tmpfs /tmp \
            --tmpfs /home/pwuser \
            --shm-size=1g \
            --cap-drop=ALL \
            --security-opt no-new-privileges \
            -e CI=true \
            -v "$PWD/test-results:/app/test-results" \
            -v "$PWD/playwright-report:/app/playwright-report" \
            -v "$PWD/storage-state:/app/storage-state" \
            -v "$PWD/screenshots:/app/screenshots" \
            ${{ env.IMAGE_NAME }}:ci \
            node scripts/run-app-suite.cjs --app=local --suite=shared-api

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-test-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          if-no-files-found: warn
          retention-days: 7

  upload-sarif:
    name: Upload Trivy findings
    runs-on: ubuntu-latest
    needs: docker
    if: >-
      needs.docker.result == 'success' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 10
    steps:
      - name: Download Trivy SARIF
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: trivy-sarif
          path: trivy-results

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          sarif_file: trivy-results/trivy-results.sarif

  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=latest

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image to GHCR
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
