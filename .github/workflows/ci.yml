name: Playwright CI

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan repository secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency_audit:
    name: Dependency audit (production)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Report all dependency advisories
        run: npm audit
        continue-on-error: true

  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      node-version: ${{ steps.meta.outputs.node-version }}
      test-scope: ${{ steps.meta.outputs.test-scope }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve CI metadata
        id: meta
        shell: bash
        run: |
          echo "node-version=24" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "test-scope=smoke" >> "$GITHUB_OUTPUT"
          else
            echo "test-scope=full" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ steps.meta.outputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ needs.install.outputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ needs.install.outputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npm run typecheck

  code_quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - lint
      - typecheck
    steps:
      - name: Summarize quality gate
        run: echo "Lint and type checking completed successfully."

  test:
    name: Test
    runs-on: ubuntu-latest
    needs:
      - install
      - code_quality
      - dependency_audit
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ needs.install.outputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prepare report directories
        shell: bash
        run: |
          mkdir -p test-results/json
          mkdir -p test-results/junit
          mkdir -p playwright-report
          mkdir -p test-results/artifacts

      - name: Run app-specific Playwright suites
        shell: bash
        env:
          CI: 'true'
          # Optional private-instance overrides. Unset or empty values use the documented
          # public demo defaults in src/config/public-demo-credentials.ts.
          CURA_USERNAME: ${{ secrets.CURA_USERNAME }}
          CURA_PASSWORD: ${{ secrets.CURA_PASSWORD }}
          SAUCEDEMO_USERNAME: ${{ secrets.SAUCEDEMO_USERNAME }}
          SAUCEDEMO_PASSWORD: ${{ secrets.SAUCEDEMO_PASSWORD }}
          ORANGEHRM_USERNAME: ${{ secrets.ORANGEHRM_USERNAME }}
          ORANGEHRM_PASSWORD: ${{ secrets.ORANGEHRM_PASSWORD }}
        run: |
          failures=0

          if [ "${{ needs.install.outputs.test-scope }}" = "smoke" ]; then
            runs=(
              "saucedemo:smoke"
              "cura:smoke"
              "orangehrm:smoke"
              "local:shared-api"
            )
          else
            runs=(
              "saucedemo:auth"
              "saucedemo:smoke"
              "saucedemo:regression"
              "saucedemo:accessibility"
              "saucedemo:shared-auth"
              "cura:auth"
              "cura:smoke"
              "cura:regression"
              "cura:shared-auth"
              "orangehrm:auth"
              "orangehrm:smoke"
              "orangehrm:regression"
              "orangehrm:accessibility"
              "orangehrm:shared-auth"
              "local:shared-api"
            )
          fi

          for run in "${runs[@]}"; do
            IFS=':' read -r app suite <<< "$run"
            echo "Running suite ${app}/${suite}"

            if ! node scripts/run-app-suite.cjs --app="$app" --suite="$suite" --project=chromium; then
              failures=1
            fi
          done

          exit "$failures"

      - name: Upload JUnit results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: junit-results-by-app-suite
          path: test-results/junit/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload JSON results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: json-results-by-app-suite
          path: test-results/json/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-html-report-by-app-suite
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 30

  publish_report:
    name: Publish Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - install
      - test
    if: always()
    steps:
      - name: Download pipeline artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: collected-artifacts

      - name: Build run summary
        shell: bash
        run: |
          echo "## Pipeline Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Test scope: \`${{ needs.install.outputs.test-scope }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Test result: \`${{ needs.test.result }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Generated app/suite artifacts" >> "$GITHUB_STEP_SUMMARY"
          if [ -d "collected-artifacts" ]; then
            find collected-artifacts -maxdepth 3 -type f | sort | sed 's#^#- `#; s#$#`#' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- No artifacts collected" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload consolidated CI artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-artifacts-${{ github.run_number }}
          path: collected-artifacts/
          if-no-files-found: warn
          retention-days: 30
