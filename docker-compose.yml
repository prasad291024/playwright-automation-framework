name: ui-automation-framework

x-test-common: &test-common
  build:
    context: .
    dockerfile: Dockerfile
  image: ui-automation-framework:1.64.1
  init: true
  read_only: true
  user: '1001:1001'
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  shm_size: 1gb
  mem_limit: 2g
  cpus: 2.0
  stop_grace_period: 60s
  tmpfs:
    - /tmp
    - /home/pwuser
  env_file:
    - path: .env
      required: false
  environment:
    CI: 'true'
    PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  volumes:
    - ./test-results:/app/test-results
    - ./playwright-report:/app/playwright-report
    - ./storage-state:/app/storage-state
    - ./screenshots:/app/screenshots
  networks:
    - playwright-network

services:
  test:
    <<: *test-common
    command: ['npx', 'playwright', 'test']

  test-headed:
    <<: *test-common
    command: ['xvfb-run', '-a', 'npx', 'playwright', 'test', '--headed']
    environment:
      CI: 'false'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    profiles:
      - headed

networks:
  playwright-network:
    driver: bridge
